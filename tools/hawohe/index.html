<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>「は」「を」「へ」クイズ</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #f0fdf4;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        #game-container {
            background-color: white;
            border-radius: 24px;
            padding: 25px;
            box-sizing: border-box;
            width: 100%;
            max-width: 700px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border: 6px solid #86efac;
            position: relative;
            overflow: hidden;
        }

        #status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f8fafc;
            padding: 10px 15px;
            border-radius: 16px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #e2e8f0;
            gap: 5px;
        }

        #lives-display {
            letter-spacing: 2px;
            font-size: 20px;
        }

        #apple-display-box {
            background-color: #fff5f5;
            border: 2px solid #fecaca;
            padding: 4px 10px;
            border-radius: 20px;
            color: #dc2626;
            font-size: 16px;
        }

        #stats-display {
            color: #0ea5e9;
            text-align: right;
            font-size: 16px;
            line-height: 1.3;
        }

        #combo-display {
            color: #f59e0b;
            font-size: 18px;
            font-weight: bold;
            height: 25px;
            margin-bottom: 5px;
            animation: bounce 0.5s ease;
        }

        #evolution-container {
            background: linear-gradient(to bottom, #bae6fd 0%, #e0f2fe 70%, #dcfce7 70%, #bbf7d0 100%);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 3px solid #7dd3fc;
            position: relative;
        }

        #pet-emoji {
            font-size: 100px;
            line-height: 1;
            margin-bottom: 10px;
            transition: transform 0.3s;
        }

        .evolve-animation {
            animation: evolve 1s ease-in-out;
        }

        #pet-name {
            font-size: 24px;
            font-weight: bold;
            color: #0369a1;
            background-color: rgba(255, 255, 255, 0.8);
            display: inline-block;
            padding: 5px 20px;
            border-radius: 20px;
        }

        #next-evolution {
            font-size: 16px;
            color: #475569;
            margin-top: 8px;
            font-weight: bold;
        }

        #question-box {
            background-color: #fffbeb;
            border-radius: 16px;
            padding: 30px 15px;
            margin-bottom: 20px;
            border: 3px dashed #fcd34d;
            transition: transform 0.2s;
        }

        .shake {
            animation: shake 0.4s;
            border-color: #ef4444 !important;
            background-color: #fef2f2 !important;
        }

        #question {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            line-height: 1.6;
            word-break: auto-phrase;
        }

        .blank {
            color: #dc2626;
            background-color: #fee2e2;
            padding: 2px 15px;
            border-radius: 8px;
            margin: 0 5px;
            border-bottom: 4px solid #fca5a5;
            display: inline-block;
        }

        #options-container {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin-bottom: 10px;
        }

        .btn {
            flex: 1;
            font-size: 50px;
            font-weight: bold;
            padding: 20px 0;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            color: white;
        }

        .btn:active {
            transform: translateY(4px);
        }

        .btn-color-0 { background-color: #3b82f6; box-shadow: 0 6px #1d4ed8; }
        .btn-color-0:active { box-shadow: 0 2px #1d4ed8; }

        .btn-color-1 { background-color: #ef4444; box-shadow: 0 6px #b91c1c; }
        .btn-color-1:active { box-shadow: 0 2px #b91c1c; }

        #result-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255,255,255,0.95);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #result-content {
            text-align: center;
            padding: 20px;
        }

        #result-mark {
            font-size: 140px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .correct-text { color: #10b981; animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .wrong-text { color: #64748b; animation: drop 0.4s ease; }
        .gameover-text { color: #dc2626; font-size: 80px !important; animation: shake 0.5s; }

        #result-message {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #sub-message {
            font-size: 24px;
            color: #f59e0b;
            font-weight: bold;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .action-btn {
            font-size: 26px;
            padding: 20px 60px;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }
        
        .btn-next { background-color: #10b981; box-shadow: 0 6px #047857; }
        .btn-next:active { transform: translateY(4px); box-shadow: 0 2px #047857; }
        
        .btn-retry { background-color: #ef4444; box-shadow: 0 6px #b91c1c; }
        .btn-retry:active { transform: translateY(4px); box-shadow: 0 2px #b91c1c; }

        /* クリア画面のスタイル */
        #clear-screen {
            display: none;
            text-align: center;
            padding: 20px 10px;
        }

        #clear-icon {
            font-size: 120px;
            margin-bottom: 10px;
            animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #clear-title {
            font-size: 40px;
            color: #f59e0b;
            font-weight: bold;
            margin-bottom: 15px;
        }

        #clear-message {
            font-size: 24px;
            color: #333;
            margin-bottom: 15px;
            font-weight: bold;
        }

        #clear-apple-total {
            font-size: 26px;
            color: #dc2626;
            font-weight: bold;
            background-color: #fff5f5;
            border: 3px dashed #fca5a5;
            display: inline-block;
            padding: 8px 25px;
            border-radius: 30px;
            margin-bottom: 30px;
        }

        #clear-score-box {
            background-color: #f0f9ff;
            border: 3px solid #7dd3fc;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 40px;
        }

        #clear-score {
            font-size: 50px;
            color: #0ea5e9;
            font-weight: bold;
        }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes drop {
            0% { transform: translateY(-50px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        @keyframes evolve {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.5) rotate(10deg); filter: brightness(1.5); }
            100% { transform: scale(1); filter: brightness(1); }
        }
    </style>
</head>

        { textBefore: "おこのみやきを ", textAfter: "らで ひっくり かえす。", choices: ["え", "へ"], correct: "へ" },
        { textBefore: "あそびすぎて おなかが ", textAfter: "った。", choices: ["え", "へ"], correct: "へ" },

    // 100問に合わせて進化のタイミングを再調整
    const evolutionStages = [
        { req: 0,   emoji: "🫘", name: "たね" },
        { req: 10,  emoji: "🌱", name: "ふたば" },
        { req: 25,  emoji: "🌿", name: "はっぱ" },
        { req: 45,  emoji: "🌲", name: "ちいさな き" },
        { req: 65,  emoji: "🌳", name: "おおきな き" },
        { req: 85,  emoji: "🌸", name: "はなまんかいの き" },
        { req: 100, emoji: "🍎", name: "りんごの き" }
    ];

    // クリアの目標を 100 に変更
    const CLEAR_GOAL = 100;
    const MAX_LIVES = 3;
    
    let shuffledQuestions = [];
    let currentQ = null;
    let lives = MAX_LIVES;
    let score = 0;
    let combo = 0;
    let correctCount = 0;
    let currentStageLevel = 0;

    // ブラウザに保存されている「あつめたリンゴの数」を読み込む
    let appleCount = parseInt(localStorage.getItem('appleCount')) || 0;

    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function getNextQuestionData() {
        if (shuffledQuestions.length === 0) {
            shuffledQuestions = shuffle([...allQuestions]);
        }
        return shuffledQuestions.pop();
    }

    function updateAppleDisplay() {
        document.getElementById("apple-count").innerText = appleCount;
    }

    function updateStatusBar() {
        let hearts = '❤️'.repeat(lives) + '🖤'.repeat(MAX_LIVES - lives);
        document.getElementById("lives-display").innerText = hearts;
        document.getElementById("correct-count").innerText = correctCount;
        document.getElementById("score-display").innerText = score;
        
        const comboDiv = document.getElementById("combo-display");
        if (combo >= 2) {
            comboDiv.innerText = `🔥 ${combo}れんぞく せいかい！ 🔥`;
        } else {
            comboDiv.innerText = "";
        }
        
        updateAppleDisplay();
        updateEvolution();
    }

    function updateEvolution() {
        let newLevel = 0;
        for (let i = 0; i < evolutionStages.length; i++) {
            if (correctCount >= evolutionStages[i].req) {
                newLevel = i;
            }
        }

        const petEmoji = document.getElementById("pet-emoji");
        const petName = document.getElementById("pet-name");
        const nextEvo = document.getElementById("next-evolution");

        if (newLevel > currentStageLevel && newLevel > 0) {
            petEmoji.classList.remove("evolve-animation");
            void petEmoji.offsetWidth;
            petEmoji.classList.add("evolve-animation");
        }
        
        currentStageLevel = newLevel;
        const stage = evolutionStages[currentStageLevel];
        
        petEmoji.innerText = stage.emoji;
        petName.innerText = stage.name;

        if (currentStageLevel < evolutionStages.length - 1) {
            let nextReq = evolutionStages[currentStageLevel + 1].req;
            let remain = nextReq - correctCount;
            nextEvo.innerText = `あと ${remain}もん せいかいで しんか！`;
            nextEvo.style.color = "#475569";
        } else {
            let remain = CLEAR_GOAL - correctCount;
            if (remain > 0) {
                nextEvo.innerText = `あと ${remain}もん せいかいで クリア！`;
                nextEvo.style.color = "#d97706";
            } else {
                nextEvo.innerText = `ゲームクリア！！`;
            }
        }
    }

    function initGame() {
        lives = MAX_LIVES;
        score = 0;
        combo = 0;
        correctCount = 0;
        currentStageLevel = 0;
        shuffledQuestions = [];
        
        document.getElementById("clear-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "none";
        document.getElementById("quiz-screen").style.display = "block";
        
        updateStatusBar();
        showQuestion();
    }

    function showQuestion() {
        currentQ = getNextQuestionData();
        const questionBox = document.getElementById("question-box");
        questionBox.classList.remove("shake");
        
        document.getElementById("question").innerHTML = `${currentQ.textBefore}<span class="blank"> </span>${currentQ.textAfter}`;
        
        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = ""; 
        
        currentQ.choices.forEach((choice, index) => {
            const btn = document.createElement("button");
            btn.className = `btn btn-color-${index}`;
            btn.innerText = choice;
            btn.onclick = () => answer(choice);
            optionsContainer.appendChild(btn);
        });
    }

    function showClearScreen() {
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("clear-screen").style.display = "block";
        
        // りんごの数を1つ増やしてブラウザに保存する
        appleCount++;
        localStorage.setItem('appleCount', appleCount);
        
        // クリア画面のりんご数と、ステータスバーの表示を更新
        document.getElementById("clear-apple-count").innerText = appleCount;
        updateAppleDisplay();
        
        // ライフ1つにつき 100点のボーナス
        let lifeBonus = lives * 100;
        let totalScore = score + lifeBonus;
        
        document.getElementById("clear-score").innerHTML = `
            ${totalScore} てん！<br>
            <span style="font-size:18px; color:#64748b; font-weight:normal;">
            ( のこりライフ ボーナス: +${lifeBonus}てん )
            </span>
        `;
    }

    function answer(selected) {
        const isCorrect = (selected === currentQ.correct);
        const resultScreen = document.getElementById("result-screen");
        const markDiv = document.getElementById("result-mark");
        const msgDiv = document.getElementById("result-message");
        const subDiv = document.getElementById("sub-message");
        const nextBtn = document.getElementById("next-btn");

        if (isCorrect) {
            combo++;
            correctCount++;
            let earnedPoints = 10 + (combo * 10);
            score += earnedPoints;

            let healMessage = "";
            if (combo % 10 === 0 && lives < MAX_LIVES) {
                lives++;
                healMessage = "<br><span style='color:#ef4444;'>❤️ ライフが 1 かいふくしたよ！</span>";
            }
            
            markDiv.innerText = "〇";
            markDiv.className = "correct-text";
            msgDiv.innerText = "せいかい！";
            msgDiv.style.color = "#10b981";
            subDiv.innerHTML = `+${earnedPoints} てん！${healMessage}`;
            
            nextBtn.innerText = "つぎへ";
            nextBtn.className = "action-btn btn-next";
            
            nextBtn.onclick = () => {
                document.getElementById("result-screen").style.display = "none";
                if (correctCount >= CLEAR_GOAL) {
                    showClearScreen();
                } else {
                    updateStatusBar();
                    showQuestion();
                }
            };
            
            resultScreen.style.display = "flex";
            
        } else {
            lives--;
            combo = 0;
            updateStatusBar();
            
            const questionBox = document.getElementById("question-box");
            questionBox.classList.add("shake");
            
            setTimeout(() => {
                if (lives <= 0) {
                    markDiv.innerText = "💔"; 
                    markDiv.className = "gameover-text";
                    msgDiv.innerText = "ゲームオーバー...";
                    msgDiv.style.color = "#dc2626";
                    subDiv.innerHTML = `ライフが ゼロに なった...<br><span style="font-size:20px; color:#475569;">${correctCount}もん せいかい したよ！<br>またはじめから 育てよう！</span>`;
                    
                    nextBtn.innerText = "さいしょから";
                    nextBtn.className = "action-btn btn-retry";
                    nextBtn.onclick = initGame;
                } else {
                    markDiv.innerText = "×";
                    markDiv.className = "wrong-text";
                    msgDiv.innerText = `ざんねん！ 正解は 「${currentQ.correct}」`;
                    msgDiv.style.color = "#64748b";
                    subDiv.innerText = "ライフが １つ へったよ！";
                    
                    nextBtn.innerText = "つぎへ";
                    nextBtn.className = "action-btn btn-next";
                    nextBtn.onclick = () => {
                        document.getElementById("result-screen").style.display = "none";
                        showQuestion();
                    };
                }
                resultScreen.style.display = "flex";
            }, 400);
        }
    }

    initGame();
</script>
