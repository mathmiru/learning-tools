<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ひらがなパーク</title>
    <style>
        body { 
            font-family: 'Hiragino Kaku Gothic ProN', 'M PLUS Rounded 1c', sans-serif; 
            text-align: center; 
            background-color: #2c3e50; 
            margin: 0; padding: 0; 
            overflow-x: hidden; 
            touch-action: manipulation; 
            color: #333; 
        }
        
        /* ゲーム画面全体 */
        .game-wrapper {
            max-width: 600px; 
            margin: 0 auto; 
            background: #eef9f0; 
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* HUD (スコア表示など) */
        .hud {
            background: #34495e; 
            color: white; 
            padding: 10px 20px;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            font-size: 20px; 
            font-weight: bold; 
            border-bottom: 5px solid #2c3e50;
        }
        .score-box { color: #f1c40f; font-size: 24px; }
        .combo-box { color: #e74c3c; font-size: 20px; opacity: 0; transition: opacity 0.2s; }
        .combo-box.show { opacity: 1; transform: scale(1.2); }

        /* メインエリア */
        .container { 
            padding: 20px; 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        /* イラストとヒント */
        .illust-area { position: relative; width: 100%; height: 160px; margin-bottom: 20px; }
        #illust-display { 
            font-size: 110px; 
            line-height: 140px; 
            transition: transform 0.2s; 
            cursor: default; 
            letter-spacing: -15px; 
        }
        
        /* ヒントボタン */
        .hint-btn {
            position: absolute; right: 10px; bottom: 0;
            background: #3498db; color: white; border: none;
            border-radius: 50px; padding: 8px 16px; font-size: 16px; font-weight: bold;
            cursor: pointer; box-shadow: 0 4px 0 #2980b9; transition: transform 0.1s;
            display: flex; align-items: center; gap: 5px;
        }
        .hint-btn:active { transform: translateY(4px); box-shadow: none; }
        .hint-used { background: #95a5a6; box-shadow: 0 4px 0 #7f8c8d; }

        /* 文字スロット */
        .word-area { 
            display: flex; 
            justify-content: center; 
            gap: 6px; 
            margin-bottom: 25px; 
            flex-wrap: wrap; 
        }
        .slot { 
            width: 55px; height: 55px; 
            line-height: 55px; 
            font-size: 30px; 
            font-weight: bold; 
            background: #fff; 
            border: 3px dashed #bdc3c7; 
            border-radius: 12px; 
            color: transparent; 
            transition: all 0.2s; 
        }
        .slot.filled { 
            background: #fff9e6; 
            border: 3px solid #f39c12; 
            color: #333; 
            transform: scale(1.1); 
            box-shadow: 0 4px 0 rgba(0,0,0,0.1); 
        }
        .static-char { 
            font-size: 30px; 
            font-weight: bold; 
            color: #7f8c8d; 
            width: 55px; 
            line-height: 55px; 
        }

        /* 選択肢ボタン */
        .choices { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px; 
            width: 100%; 
            max-width: 380px; 
        }
        .choice-btn { 
            font-size: 28px; 
            padding: 12px 0; 
            cursor: pointer; 
            border: 4px solid #ecf0f1; 
            border-radius: 15px; 
            background: #fff; 
            box-shadow: 0 6px 0 #bdc3c7; 
            transition: all 0.1s; 
            color: #2c3e50; 
            font-weight: bold;
            user-select: none; 
            -webkit-tap-highlight-color: transparent;
        }
        .choice-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #bdc3c7; }

        /* アニメーション */
        .shake { animation: shake-ani 0.4s; background-color: #e74c3c !important; border-color: #c0392b !important; color: white !important; }
        @keyframes shake-ani { 0% {transform: translateX(0);} 25% {transform: translateX(-6px);} 50% {transform: translateX(6px);} 75% {transform: translateX(-6px);} 100% {transform: translateX(0);} }

        .jump { animation: jump-ani 0.6s infinite; }
        @keyframes jump-ani { 0%, 100% {transform: scale(1);} 50% {transform: scale(1.2) rotate(5deg);} }

        /* ポップアップ */
        .score-popup {
            position: absolute; color: #f1c40f; font-weight: bold; font-size: 40px;
            text-shadow: 2px 2px 0 #e67e22; pointer-events: none;
            animation: float-up 1s forwards; z-index: 100;
        }
        @keyframes float-up { 0% {opacity: 1; transform: translateY(0) scale(0.5);} 50% {transform: translateY(-50px) scale(1.2);} 100% {opacity: 0; transform: translateY(-100px) scale(1);} }

        /* メニュー画面 */
        #menu-screen { text-align: center; padding-top: 50px; }
        
        .level-btn { 
            display: block; width: 85%; margin: 15px auto; padding: 18px; 
            font-size: 18px; background: white; border: 4px solid #2ecc71; 
            color: #27ae60; border-radius: 50px; cursor: pointer; 
            box-shadow: 0 6px 0 #27ae60; transition: transform 0.1s; font-weight: bold;
        }
        .level-btn:active { transform: translateY(6px); box-shadow: none; }
        
        #message { height: 30px; font-size: 20px; font-weight: bold; color: #e74c3c; margin: 5px 0; }

        /* 戻るボタン */
        .back-btn { margin-top: auto; background: none; border: none; color: #95a5a6; text-decoration: underline; cursor: pointer; padding: 20px; }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div id="menu-screen">
        <h1 style="color:#2c3e50; margin:0 0 30px 0; font-size: 40px;">ひらがなパーク</h1>
        <button class="level-btn" onclick="startGame(1)">Lv.1 １文字あな（きほん）</button>
        <button class="level-btn" onclick="startGame(2)">Lv.2 ２文字あな（きほん）</button>
        <button class="level-btn" onclick="startGame(3)">Lv.3 ぜんぶ入力（きほん）</button>
        <button class="level-btn" onclick="startGame(4)">Lv.4 １文字あな（だくおん他）</button>
        <button class="level-btn" onclick="startGame(5)">Lv.5 ぜんぶ入力（だくおん他）</button>
    </div>

    <div id="game-screen" style="display:none; flex-direction:column; height:100%;">
        <div class="hud">
            <div>スコア: <span id="score-val" class="score-box">0</span></div>
            <div id="combo-display" class="combo-box">0 コンボ！</div>
        </div>

        <div class="container">
            <div id="message"></div>
            
            <div class="illust-area">
                <div id="illust-display"></div>
                <button class="hint-btn" onclick="useHint()" id="hint-button">
                    <span>🔊</span> きく
                </button>
            </div>

            <div class="word-area" id="word-slots"></div>
            <div class="choices" id="choices-area"></div>
            
            <button class="back-btn" onclick="location.reload()">あきらめてメニューにもどる</button>
        </div>
    </div>
</div>

<script>
    // ---------------------------------------------------------
    // 【妥協ゼロの100%コンプリート版】データ定義
    // 全発音を網羅しつつ、子供が直感でわかる擬音語・単語に厳選！
    // ---------------------------------------------------------
    const basicWords = [
        {word:'あり', icon:'🐜', target:[0]}, {word:'いちご', icon:'🍓', target:[0]},
        {word:'うさぎ', icon:'🐰', target:[0]}, {word:'えんぴつ', icon:'✏️', target:[0]},
        {word:'おにぎり', icon:'🍙', target:[0]}, 
        {word:'かさ', icon:'☂️', target:[0]}, {word:'きのこ', icon:'🍄', target:[0]},
        {word:'くるま', icon:'🚗', target:[0]}, {word:'けいと', icon:'🧶', target:[0]},
        {word:'こおり', icon:'🧊', target:[0]}, 
        {word:'さかな', icon:'🐟', target:[0]}, {word:'しか', icon:'🦌', target:[0]},
        {word:'すいか', icon:'🍉', target:[0]}, {word:'せっけん', icon:'🧼', target:[0]},
        {word:'そり', icon:'🛷', target:[0]}, 
        {word:'たいこ', icon:'🥁', target:[0]}, {word:'ちきゅう', icon:'🌍', target:[0]},
        {word:'つり', icon:'🎣', target:[0]}, {word:'てぶくろ', icon:'🧤', target:[0]},
        {word:'とけい', icon:'⏰', target:[0]}, 
        {word:'なす', icon:'🍆', target:[0]}, {word:'にんじん', icon:'🥕', target:[0]},
        {word:'ぬいぐるみ', icon:'🧸', target:[0]}, {word:'ねこ', icon:'🐈', target:[0]},
        {word:'のこぎり', icon:'🪚', target:[0]},
        {word:'はさみ', icon:'✂️', target:[0]}, {word:'ひまわり', icon:'🌻', target:[0]},
        {word:'ふうせん', icon:'🎈', target:[0]}, {word:'へび', icon:'🐍', target:[0]},
        {word:'ほん', icon:'📕', target:[0]}, 
        {word:'まいく', icon:'🎤', target:[0]}, {word:'みかん', icon:'🍊', target:[0]},
        {word:'むし', icon:'🐛', target:[0]}, {word:'めがね', icon:'👓', target:[0]},
        {word:'もも', icon:'🍑', target:[0]}, 
        {word:'やま', icon:'⛰️', target:[0]}, {word:'ゆき', icon:'⛄', target:[0]},
        {word:'よっと', icon:'⛵', target:[0]}, 
        {word:'らいおん', icon:'🦁', target:[0]}, {word:'りんご', icon:'🍎', target:[0]},
        {word:'かえる', icon:'🐸', target:[2]}, {word:'れもん', icon:'🍋', target:[0]}, 
        {word:'ろうそく', icon:'🕯️', target:[0]},
        {word:'わに', icon:'🐊', target:[0]}, {word:'きりん', icon:'🦒', target:[2]}
    ];

    const complexWords = [
        // 濁音・半濁音
        {word:'がっこう', icon:'🏫', target:[0]}, {word:'かぎ', icon:'🗝️', target:[1]},
        {word:'はぐるま', icon:'⚙️', target:[1]}, {word:'ひげ', icon:'🧔', target:[1]},
        {word:'ごりら', icon:'🦍', target:[0]},
        {word:'ざりがに', icon:'🦞', target:[0]}, {word:'じてんしゃ', icon:'🚲', target:[0]},
        {word:'ねずみ', icon:'🐭', target:[1]}, {word:'かぜ', icon:'🌬️', target:[1]}, 
        {word:'ぞう', icon:'🐘', target:[0]}, 
        {word:'だんご', icon:'🍡', target:[0]}, {word:'みかづき', icon:'🌙', target:[2]}, 
        {word:'でんしゃ', icon:'🚃', target:[0]}, {word:'どんぐり', icon:'🌰', target:[0]}, 
        {word:'ばなな', icon:'🍌', target:[0]}, {word:'はなび', icon:'🎆', target:[2]}, 
        {word:'ぶた', icon:'🐷', target:[0]}, {word:'べんとう', icon:'🍱', target:[0]},
        {word:'ぼうし', icon:'👒', target:[0]}, 
        {word:'ぱん', icon:'🍞', target:[0]}, {word:'ぴあの', icon:'🎹', target:[0]},
        {word:'ぷりん', icon:'🍮', target:[0]}, {word:'ぺんぎん', icon:'🐧', target:[0]},
        {word:'ぽすと', icon:'📮', target:[0]}, 

        // 促音（小さい「っ」）
        {word:'らっこ', icon:'🦦', target:[1]}, {word:'きっぷ', icon:'🎫', target:[1]},
        {word:'ばった', icon:'🦗', target:[1]}, {word:'らっぱ', icon:'🎺', target:[1]},
        {word:'ろけっと', icon:'🚀', target:[2]},

        // 拗音全33種類コンプリート（絵でわかる言葉＆オノマトペを活用！）
        {word:'きゃべつ', icon:'🥬', target:[1]},       // きゃ
        {word:'きゅうり', icon:'🥒', target:[1]},       // きゅ
        {word:'きょうりゅう', icon:'🦖', target:[1]},   // きょ
        
        {word:'ぎゃく', icon:'🔄', target:[1]},         // ぎゃ
        {word:'ぎゅうにゅう', icon:'🥛', target:[1]},   // ぎゅ
        {word:'きんぎょ', icon:'🐠', target:[3]},       // ぎょ
        
        {word:'しゃしん', icon:'📷', target:[1]},       // しゃ
        {word:'しゅりけん', icon:'🥷', target:[1]},     // しゅ
        {word:'しょくぱん', icon:'🍞', target:[1]},     // しょ
        
        {word:'じゃがいも', icon:'🥔', target:[1]},     // じゃ
        {word:'じゅーす', icon:'🧃', target:[1]},       // じゅ
        {word:'まじょ', icon:'🧙‍♀️', target:[2]},        // じょ
        
        {word:'おちゃ', icon:'🍵', target:[2]},         // ちゃ
        {word:'ちゅうしゃ', icon:'💉', target:[1]},     // ちゅ
        {word:'ちょうちょ', icon:'🦋', target:[1]},     // ちょ
        
        {word:'にゃんこ', icon:'🐱', target:[1]},       // にゃ
        {word:'にゅうす', icon:'📰', target:[1]},       // にゅ
        {word:'にんぎょ', icon:'🧜‍♀️', target:[3]},       // にょ
        
        {word:'ひゃくてん', icon:'💯', target:[1]},     // ひゃ
        {word:'ひゅーひゅー', icon:'🌪️', target:[1]},   // ひゅ（風の音）
        {word:'ひょう', icon:'🐆', target:[1]},         // ひょ
        
        {word:'さんびゃく', icon:'🪙', target:[3]},     // びゃ（300円）
        {word:'びゅんびゅん', icon:'🏎️', target:[1]},   // びゅ（速い車）
        {word:'びょういん', icon:'🏥', target:[1]},     // びょ
        
        {word:'ぴゃあぴゃあ', icon:'🐤', target:[1]},   // ぴゃ（ヒナの鳴き声）
        {word:'こんぴゅーた', icon:'💻', target:[3]},   // ぴゅ
        {word:'ぴょんぴょん', icon:'🐸', target:[1]},   // ぴょ（カエルのジャンプ）
        
        {word:'みゃく', icon:'💓', target:[1]},         // みゃ（ドクドク）
        {word:'みゅーじかる', icon:'🎭', target:[1]},   // みゅ
        {word:'みょうじ', icon:'📛', target:[1]},       // みょ（名札で表現、音声ヒントあり）
        
        {word:'りゃま', icon:'🦙', target:[1]},         // りゃ（動物のリャマ）
        {word:'りゅっく', icon:'🎒', target:[1]},       // りゅ
        {word:'りょうり', icon:'🍳', target:[1]}        // りょ
    ];

    let currentLevel = 1, currentQuiz = null, fillIndex = 0, holes = [];
    let quizDeck = [];
    let lastWord = "";
    
    // ゲーム状態
    let score = 0;
    let combo = 0;
    let hintUsed = false;

    window.addEventListener('DOMContentLoaded', () => {
        document.body.addEventListener('touchstart', function() {}, {passive: true});
        warmUpVoice();
    });

    function warmUpVoice() {
        window.speechSynthesis.cancel();
        const uttr = new SpeechSynthesisUtterance(""); 
        window.speechSynthesis.speak(uttr);
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startGame(level) {
        warmUpVoice();
        currentLevel = level;
        quizDeck = [];
        lastWord = "";
        score = 0;
        combo = 0;
        updateScoreBoard();

        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';
        nextQuiz();
    }

    function updateScoreBoard() {
        document.getElementById('score-val').innerText = score;
        const comboEl = document.getElementById('combo-display');
        if (combo > 1) {
            comboEl.innerText = combo + " コンボ！";
            comboEl.classList.add('show');
        } else {
            comboEl.classList.remove('show');
        }
    }

    function nextQuiz() {
        hintUsed = false;
        document.getElementById('hint-button').classList.remove('hint-used');

        if (quizDeck.length === 0) {
            const data = (currentLevel >= 4) ? [...complexWords] : [...basicWords];
            shuffle(data);
            if (data[0].word === lastWord && data.length > 1) {
                data.push(data.shift());
            }
            quizDeck = data;
        }

        currentQuiz = quizDeck.shift();
        lastWord = currentQuiz.word;
        fillIndex = 0; holes = [];
        
        document.getElementById('illust-display').innerText = currentQuiz.icon;
        document.getElementById('illust-display').classList.remove('jump');
        document.getElementById('message').innerText = "";

        const slotsEl = document.getElementById('word-slots');
        slotsEl.innerHTML = "";
        
        if (currentLevel === 1 || currentLevel === 4) {
            holes = [currentQuiz.target[0]];
        } else if (currentLevel === 2) {
            holes = currentQuiz.word.length <= 2 ? [0, 1] : [currentQuiz.target[0], (currentQuiz.target[0]+1) % currentQuiz.word.length];
        } else {
            currentQuiz.word.split('').forEach((_, i) => holes.push(i));
        }

        // 穴のインデックスを小さい順（左から右）に並び替える
        holes.sort((a, b) => a - b);

        currentQuiz.word.split('').forEach((char, i) => {
            let div = document.createElement('div');
            if (holes.includes(i)) {
                div.className = 'slot'; div.id = 'slot-' + i;
            } else {
                div.className = 'static-char'; div.innerText = char;
            }
            slotsEl.appendChild(div);
        });

        setupChoices();
    }

    function useHint() {
        if (!hintUsed) {
            hintUsed = true;
            document.getElementById('hint-button').classList.add('hint-used');
            playVoice(currentQuiz.word);
        } else {
            playVoice(currentQuiz.word);
        }
    }

    function setupChoices() {
        const choicesEl = document.getElementById('choices-area');
        choicesEl.innerHTML = "";
        
        let targetIdx = holes[fillIndex];
        let correctChar = currentQuiz.word[targetIdx];
        let pool = [correctChar];

        // 誤答（ダミー）作成ロジック
        if (currentLevel >= 4) {
            const youonChars = ['ゃ','ゅ','ょ','っ','や','ゆ','よ','つ'];
            const dakuMap = {
                'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご','さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ','た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど','は':'ばぱ','ひ':'びぴ','ふ':'ぶぷ','へ':'べぺ','ほ':'ぼぽ','が':'か','ぎ':'き','ぐ':'く','げ':'け','ご':'こ','ざ':'さ','じ':'し','ず':'す','ぜ':'せ','ぞ':'そ','だ':'た','ぢ':'ち','づ':'つ','て':'で','ど':'と','ば':'はぱ','び':'ひぴ','ぶ':'ふぷ','べ':'へぺ','ぼ':'ほぽ','ぱ':'はば','ぴ':'ひび','ぷ':'ふぶ','ぺ':'へべ','ぽ':'ほぼ'
            };
            // 拗音なら拗音を混ぜる
            if (youonChars.includes(correctChar)) {
                pool = [...new Set([correctChar, ...youonChars])].slice(0, 6);
            } 
            // 濁音・半濁音なら関連文字を混ぜる
            else if (dakuMap[correctChar]) {
                let relatives = dakuMap[correctChar].split('');
                pool = [...new Set([correctChar, ...relatives])];
                const allDaku = "がぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽ";
                while(pool.length < 6) {
                    let r = allDaku[Math.floor(Math.random()*allDaku.length)];
                    if(!pool.includes(r)) pool.push(r);
                }
            }
        }

        const allKana = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん";
        while(pool.length < 6) {
            let r = allKana[Math.floor(Math.random()*allKana.length)];
            if(!pool.includes(r)) pool.push(r);
        }
        
        shuffle(pool).forEach(char => {
            let btn = document.createElement('button');
            btn.className = 'choice-btn'; btn.innerText = char;
            btn.onclick = () => {
                if (char === currentQuiz.word[holes[fillIndex]]) {
                    handleCorrect(char);
                } else {
                    handleWrong(btn);
                }
            };
            choicesEl.appendChild(btn);
        });
    }

    function handleCorrect(char) {
        const slot = document.getElementById('slot-' + holes[fillIndex]);
        slot.innerText = char;
        slot.classList.add('filled');
        fillIndex++;
        
        if (fillIndex === holes.length) {
            document.getElementById('illust-display').classList.add('jump');
            let basePoint = 100;
            let comboBonus = combo * 10;
            let earned = basePoint + comboBonus;
            if (hintUsed) earned = Math.floor(earned / 2);

            score += earned;
            combo++;
            
            showScorePopup(earned);
            updateScoreBoard();

            playVoice(currentQuiz.word);
            setTimeout(nextQuiz, 2000);
        } else {
            setupChoices();
        }
    }

    function handleWrong(btn) {
        btn.classList.add('shake');
        document.getElementById('message').innerText = "ちがうかな？";
        if (combo > 0) {
            combo = 0;
            updateScoreBoard();
        }
        setTimeout(() => {
            btn.classList.remove('shake');
            document.getElementById('message').innerText = "";
        }, 500);
    }

    function showScorePopup(amount) {
        const popup = document.createElement('div');
        popup.className = 'score-popup';
        popup.innerText = "+" + amount;
        
        const container = document.querySelector('.container');
        popup.style.top = '40%'; 
        popup.style.left = '50%';
        popup.style.marginLeft = '-40px'; 
        
        container.appendChild(popup);
        setTimeout(() => popup.remove(), 1000);
    }

    function playVoice(text) {
        window.speechSynthesis.cancel();
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'ja-JP';
        uttr.rate = 0.95;
        window.speechSynthesis.speak(uttr);
    }
</script>
</body>
</html>
