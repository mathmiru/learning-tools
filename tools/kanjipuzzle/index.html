<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>かん字がったいパズル</title>
    <style>
        body {
            font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', 'Meiryo', sans-serif;
            background-color: #f0f8ff;
            text-align: center;
            color: #333;
            margin: 0;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }
        h1 {
            color: #ff6b6b;
            text-shadow: 2px 2px 0px #fff;
        }
        p { font-size: 1.2em; font-weight: bold; }
        #title-screen, #game-screen { display: none; }
        #title-screen.active, #game-screen.active {
            display: block;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* タイトル画面ボタン */
        .grade-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 400px;
            margin: 30px auto;
        }
        .grade-btn {
            font-size: 24px;
            padding: 15px;
            background-color: #4ecdc4;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 0px #3dbbb3;
            transition: transform 0.1s;
        }
        .grade-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0px #3dbbb3;
        }

        /* パズルエリア */
        .puzzle-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }
        .drop-zone {
            width: 90px;
            height: 90px;
            background-color: #fff;
            border: 4px dashed #4ecdc4;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-size: 40px;
            font-weight: bold;
        }
        .symbol { font-size: 35px; font-weight: bold; color: #555; }
        .result-box {
            width: 100px;
            height: 100px;
            background-color: #ffe66d;
            border: 4px solid #ffcc00;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            font-weight: bold;
            color: #ff4757;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: color 0.3s;
        }

        /* パーツ置き場 */
        .parts-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 20px auto;
            max-width: 500px;
            padding: 20px;
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-height: 80px;
        }
        .part {
            width: 60px;
            height: 60px;
            background-color: #ff9ff3;
            color: white;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 0px #f368e0;
        }
        .part:hover { transform: scale(1.05); }
        .part:active { transform: translateY(4px); box-shadow: 0 0px 0px #f368e0; }

        /* ボタン類 */
        .action-btn {
            font-size: 18px;
            padding: 10px 20px;
            background-color: #1dd1a1;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 0px #10ac84;
            font-weight: bold;
            margin: 5px;
        }
        .action-btn:active { transform: translateY(4px); box-shadow: 0 0px 0px #10ac84; }
        .hint-btn { background-color: #3498db; box-shadow: 0 4px 0px #2980b9; }
        .reset-btn { background-color: #ff9f43; box-shadow: 0 4px 0px #ee5253; }
        .back-btn { background-color: #a4b0be; box-shadow: 0 4px 0px #747d8c; }
        .next-btn { 
            background-color: #ff6b6b; box-shadow: 0 4px 0px #ee5253; 
            display: none; font-size: 22px; padding: 15px 30px; 
            animation: bounce 1s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        #message {
            font-size: 22px;
            font-weight: bold;
            color: #ff4757;
            height: 30px;
            margin-top: 15px;
        }

        /* コレクションエリア */
        .collection-area {
            margin-top: 30px;
            padding: 20px;
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .collection-area h3 {
            margin-top: 0;
            color: #ff9f43;
        }
        .collected-kanji {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            background-color: #ffe66d;
            border: 2px solid #ffcc00;
            border-radius: 8px;
            padding: 5px 10px;
            margin: 5px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div id="title-screen" class="active">
        <h1>🧩かん字がったいパズル🧩</h1>
        <p>あそぶ学年をえらんでね！</p>
        <div class="grade-buttons">
            <button class="grade-btn" onclick="startGame(1)">1年生</button>
            <button class="grade-btn" onclick="startGame(2)">2年生</button>
            <button class="grade-btn" onclick="startGame(3)">3年生</button>
            <button class="grade-btn" onclick="startGame(4)">4年生</button>
            <button class="grade-btn" onclick="startGame(5)">5年生</button>
            <button class="grade-btn" onclick="startGame(6)">6年生</button>
        </div>
    </div>

    <div id="game-screen">
        <h2 id="grade-title" style="margin: 0; color: #4ecdc4;"></h2>
        
        <p>パーツをタッチして、四角の中に入れてみよう！</p>
        
        <div class="puzzle-area">
            <div class="drop-zone" id="zone-left"></div>
            <div class="symbol">＋</div>
            <div class="drop-zone" id="zone-right"></div>
            <div class="symbol">＝</div>
            <div class="result-box" id="result-kanji">？</div>
        </div>

        <div>
            <button class="action-btn" onclick="checkAnswer()">がったい！</button>
            <button class="action-btn hint-btn" onclick="showHint()">💡ヒント</button>
            <button class="action-btn reset-btn" onclick="resetPuzzle()">やりなおす</button>
        </div>
        
        <div id="message"></div>
        <button id="next-btn" class="action-btn next-btn" onclick="nextProblem()">✨つぎの問題へ✨</button>
        
        <div class="parts-container" id="parts-container"></div>

        <!-- コレクション表示エリア -->
        <div class="collection-area">
            <h3>✨あつめた漢字✨</h3>
            <div id="collected-list">
                <!-- ここに作った漢字が追加されます -->
            </div>
        </div>

        <div style="margin-top: 30px;">
            <button class="action-btn back-btn" onclick="showTitle()">もどる</button>
        </div>
    </div>

        let currentGrade = 1;
        let currentDictionary = {};
        let currentCorrectKanji = "";
        let collectedKanji = []; 

        function showScreen(screenId) {
            document.getElementById('title-screen').classList.remove('active');
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById(screenId).classList.add('active');
        }

        function showTitle() { showScreen('title-screen'); }

        function startGame(grade) {
            currentGrade = grade;
            collectedKanji = []; 
            updateCollection();
            
            document.getElementById('grade-title').innerText = grade + "年生のかん字";
            currentDictionary = kanjiData[grade];
            showScreen('game-screen');
            generateProblem();
        }

        function generateProblem() {
            const resultBox = document.getElementById("result-kanji");
            document.getElementById("zone-left").innerHTML = "";
            document.getElementById("zone-right").innerHTML = "";
            resultBox.innerText = "？";
            resultBox.style.color = "#ff4757"; 
            document.getElementById("message").innerText = "";
            document.getElementById("next-btn").style.display = "none";

            const container = document.getElementById("parts-container");
            container.innerHTML = ""; 

            const keys = Object.keys(currentDictionary);
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            currentCorrectKanji = currentDictionary[randomKey]; 
            
            // サロゲートペア（特殊な文字）を正しく分割するために Array.from を使用
            const keyChars = Array.from(randomKey);
            let part1 = keyChars[0];
            let part2 = keyChars.slice(1).join('');

            let partsToDisplay = [part1, part2];
            let usedDummies = new Set([part1, part2]); 

            let dummyCount = 0;
            let attempts = 0; 
            while(dummyCount < 4 && attempts < 100) {
                attempts++;
                const randomDummyKey = keys[Math.floor(Math.random() * keys.length)];
                
                const dKeyChars = Array.from(randomDummyKey);
                let dPart1 = dKeyChars[0];
                let dPart2 = dKeyChars.slice(1).join('');
                
                let dummyPart = Math.random() < 0.5 ? dPart1 : dPart2;
                
                if(dummyPart.trim() !== "" && !usedDummies.has(dummyPart)) {
                    partsToDisplay.push(dummyPart);
                    usedDummies.add(dummyPart);
                    dummyCount++;
                }
            }

            partsToDisplay.sort(() => Math.random() - 0.5).forEach((partText, index) => {
                const div = document.createElement("div");
                div.className = "part";
                div.innerText = partText;
                if(partText.length > 1) div.style.fontSize = "20px";
                div.onclick = function() { movePart(this); };
                container.appendChild(div);
            });
        }

        function showHint() {
            if (document.getElementById("next-btn").style.display === "inline-block") return;
            
            const resultBox = document.getElementById("result-kanji");
            resultBox.innerText = currentCorrectKanji; 
            resultBox.style.color = "rgba(255, 71, 87, 0.25)"; 
        }

        function nextProblem() {
            generateProblem();
        }

        function movePart(partElement) {
            if (document.getElementById("next-btn").style.display === "inline-block") return;

            const leftZone = document.getElementById("zone-left");
            const rightZone = document.getElementById("zone-right");
            const container = document.getElementById("parts-container");
            const message = document.getElementById("message");

            document.getElementById("result-kanji").innerText = "？";
            document.getElementById("result-kanji").style.color = "#ff4757";
            message.innerText = "";

            if (partElement.parentElement.id === "parts-container") {
                if (leftZone.children.length === 0) {
                    leftZone.appendChild(partElement);
                } else if (rightZone.children.length === 0) {
                    rightZone.appendChild(partElement);
                } else {
                    message.innerText = "四角がいっぱいだよ！";
                    message.style.color = "#ff9f43";
                }
            } else {
                container.appendChild(partElement);
            }
        }

        function checkAnswer() {
            const leftZone = document.getElementById("zone-left");
            const rightZone = document.getElementById("zone-right");
            const resultBox = document.getElementById("result-kanji");
            const message = document.getElementById("message");
            const nextBtn = document.getElementById("next-btn");

            resultBox.style.color = "#ff4757";

            if (leftZone.children.length === 0 || rightZone.children.length === 0) {
                message.innerText = "パーツを２つセットしてね！";
                message.style.color = "#ff9f43";
                return;
            }

            const leftPart = leftZone.children[0].innerText;
            const rightPart = rightZone.children[0].innerText;
            const combinedText1 = leftPart + rightPart;
            const combinedText2 = rightPart + leftPart;

            if (currentDictionary[combinedText1] || currentDictionary[combinedText2]) {
                const correctKanji = currentDictionary[combinedText1] || currentDictionary[combinedText2];
                resultBox.innerText = correctKanji;
                message.innerText = "大せいかい！「" + correctKanji + "」ができたよ！🎉";
                message.style.color = "#1dd1a1";
                nextBtn.style.display = "inline-block";

                if (!collectedKanji.includes(correctKanji)) {
                    collectedKanji.push(correctKanji);
                    updateCollection();
                }

            } else {
                resultBox.innerText = "？";
                message.innerText = "ざんねん！ちがうかん字みたい…💦";
                message.style.color = "#ff4757";
            }
        }

        function resetPuzzle() {
            if (document.getElementById("next-btn").style.display === "inline-block") return;
            const container = document.getElementById("parts-container");
            const leftZone = document.getElementById("zone-left");
            const rightZone = document.getElementById("zone-right");

            if(leftZone.children.length > 0) container.appendChild(leftZone.children[0]);
            if(rightZone.children.length > 0) container.appendChild(rightZone.children[0]);
            
            document.getElementById("result-kanji").innerText = "？";
            document.getElementById("result-kanji").style.color = "#ff4757"; 
            document.getElementById("message").innerText = "";
        }

        function updateCollection() {
            const listDiv = document.getElementById("collected-list");
            listDiv.innerHTML = ""; 
            
            if (collectedKanji.length === 0) {
                listDiv.innerHTML = "<span style='color:#999; font-size:16px;'>まだないよ</span>";
                return;
            }

            collectedKanji.forEach(kanji => {
                const span = document.createElement("span");
                span.className = "collected-kanji";
                span.innerText = kanji;
                listDiv.appendChild(span);
            });
        }
    </script>

</body>
</html>
