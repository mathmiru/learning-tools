<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>さんすう とけい (Math Clock)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kosugi Maru', sans-serif;
            background-color: #ffffff;
            min-height: 100dvh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .btn-clock {
            background-color: white;
            border: 3px solid #009E60;
            color: #009E60;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0px 4px 0px #009E60;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            cursor: pointer;
            touch-action: manipulation;
        }
        
        .btn-clock:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0px 0px 0px #009E60;
        }

        .btn-clock:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #999;
            color: #999;
            box-shadow: 0px 4px 0px #999;
        }

        .btn-clock.active-toggle {
            background-color: #009E60;
            color: white;
        }

        .btn-time {
            font-size: 1.1rem;
            padding: 0.5rem 0.25rem;
            width: 100%;
        }

        .btn-ctrl {
            font-size: 1rem;
            padding: 0.5rem 0.75rem;
            flex: 1;
            white-space: nowrap;
        }

        .btn-quiz-tab {
            background-color: #e5e7eb;
            color: #4b5563;
            border-radius: 9999px;
            padding: 0.25rem 0.75rem;
            font-size: 0.85rem;
            font-weight: bold;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .btn-quiz-tab.active {
            background-color: #fef08a;
            border-color: #eab308;
            color: #854d0e;
        }

        canvas {
            background: transparent;
            touch-action: none;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            aspect-ratio: 1 / 1;
        }
    </style>
</head>
<body class="flex flex-col items-center">

    <div id="quiz-panel" class="hidden w-full max-w-xl bg-yellow-50 border-b-4 border-yellow-400 p-2 text-center shadow-md relative shrink-0">
        <button id="btn-quiz-close" class="absolute top-1 right-2 text-gray-400 hover:text-gray-700 font-bold text-2xl px-2">&times;</button>
        <h2 class="text-lg font-bold text-orange-600 mb-1">クイズモード</h2>
        
        <div class="flex flex-wrap justify-center gap-1 mb-2">
            <button class="btn-quiz-tab active" data-mode="set">はりをあわせる</button>
            <button class="btn-quiz-tab" data-mode="read">じかんをこたえる</button>
            <button class="btn-quiz-tab" data-mode="mix">ごちゃまぜ</button>
        </div>

        <div class="mb-2">
            <select id="quiz-level-select" class="border-2 border-orange-400 rounded p-1 bg-white font-bold text-orange-600 text-sm md:text-base outline-none">
                <option value="1">レベル1 (〇じ、〇じはん)</option>
                <option value="2">レベル2 (5ふん きざみ)</option>
                <option value="3">レベル3 (1ふん きざみ)</option>
            </select>
        </div>
        
        <div id="quiz-question" class="text-xl md:text-2xl font-bold text-gray-800 mb-2 bg-white p-1 rounded border-2 border-gray-200"></div>
        
        <div id="quiz-input-area" class="hidden flex justify-center items-center gap-1 mb-2 text-lg md:text-xl font-bold">
            <select id="quiz-hour-select" class="border-2 border-blue-400 rounded p-1 bg-white text-xl w-16 text-center outline-none"></select> じ
            <select id="quiz-min-select" class="border-2 border-blue-400 rounded p-1 bg-white text-xl w-32 text-center outline-none"></select> ふん
        </div>

        <button id="btn-quiz-check" class="bg-orange-500 text-white font-bold py-2 px-8 rounded-full shadow-[0_4px_0_#c24100] active:shadow-none active:translate-y-1 text-lg mb-1 transition-all">できた！</button>
        
        <div id="quiz-feedback" class="text-2xl font-bold mt-1 hidden"></div>
        <button id="btn-quiz-next" class="hidden mx-auto mt-2 bg-blue-500 text-white font-bold py-2 px-6 rounded-full shadow-[0_4px_0_#003d99] active:shadow-none active:translate-y-1">つぎのもんだい</button>
    </div>

    <div class="flex-1 min-h-0 w-full flex justify-center items-center p-2 relative">
        <canvas id="clockCanvas" width="500" height="500"></canvas>
    </div>

    <div class="w-full shrink-0 flex flex-col items-center px-2 pb-4 gap-3 max-w-xl">
        
        <div class="grid grid-cols-3 gap-2 w-full">
            <button class="btn-clock btn-time" data-offset="60">+1じかん</button>
            <button class="btn-clock btn-time" data-offset="10">+10ふん</button>
            <button class="btn-clock btn-time" data-offset="1">+1ふん</button>
            
            <button class="btn-clock btn-time" data-offset="-60">−1じかん</button>
            <button class="btn-clock btn-time" data-offset="-10">−10ふん</button>
            <button class="btn-clock btn-time" data-offset="-1">−1ふん</button>
        </div>

        <div class="flex flex-wrap justify-center gap-2 w-full">
            <button class="btn-clock btn-ctrl" id="btn-digital">デジタル</button>
            <button class="btn-clock btn-ctrl" id="btn-now">いま</button>
            <button class="btn-clock btn-ctrl" id="btn-reset">リセット</button>
            <button class="btn-clock btn-ctrl" id="btn-hint">ヒント</button>
            <button class="btn-clock btn-ctrl active-toggle" id="btn-1224">12じかん</button>
            <button class="btn-clock btn-ctrl !border-orange-500 !text-orange-500 !shadow-orange-500" id="btn-quiz-open">クイズ</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('clockCanvas');
        const ctx = canvas.getContext('2d');
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const clockRadius = 180; 

        let totalMinutes = 720;
        let isHintVisible = false;
        let isDigitalVisible = false;
        let is12HourMode = true; 
        let isDragging = false;
        let draggedHand = null; 
        let lastAngle = 0;

        let quiz = {
            active: false,
            mode: 'set',
            currentType: 'set', 
            targetHour: 1,
            targetMinute: 0,
            isAnswered: false
        };

        const hourSelect = document.getElementById('quiz-hour-select');
        const minSelect = document.getElementById('quiz-min-select');
        const levelSelect = document.getElementById('quiz-level-select');

        for(let i=1; i<=12; i++) hourSelect.add(new Option(i, i));

        function drawClock() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(cx, cy);
            
            if (isHintVisible) drawHints(ctx, clockRadius);
            drawFace(ctx, clockRadius);
            drawTicks(ctx, clockRadius);
            drawNumbers(ctx, clockRadius);
            drawHands(ctx, clockRadius, totalMinutes);
            drawCenterDot(ctx);
            drawDigitalDisplay(ctx);
            
            ctx.restore();
        }

        function drawHints(ctx, radius) {
            ctx.font = "bold 24px 'Kosugi Maru', sans-serif";
            ctx.textBaseline = "middle";
            ctx.textAlign = "center";
            ctx.fillStyle = "#E53935";
            
            for (let num = 1; num <= 12; num++) {
                let ang = num * Math.PI / 6;
                let hintDist = radius + 35; 
                let x = hintDist * Math.sin(ang);
                let y = -hintDist * Math.cos(ang);
                let minuteVal = num * 5 === 60 ? 0 : num * 5;
                ctx.fillText(minuteVal.toString(), x, y);
            }
        }

        function drawFace(ctx, radius) {
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, 2 * Math.PI);
            ctx.fillStyle = '#fdf6e3';
            ctx.fill();
            
            ctx.strokeStyle = '#185b9d';
            ctx.lineWidth = 14;
            ctx.stroke();
        }

        function drawTicks(ctx, radius) {
            for (let i = 0; i < 60; i++) {
                let ang = i * Math.PI / 30;
                ctx.beginPath();
                let isMajor = i % 5 === 0;
                let innerRadius = isMajor ? radius * 0.85 : radius * 0.93;
                let outerRadius = radius * 0.98;
                ctx.moveTo(innerRadius * Math.sin(ang), -innerRadius * Math.cos(ang));
                ctx.lineTo(outerRadius * Math.sin(ang), -outerRadius * Math.cos(ang));
                ctx.strokeStyle = '#333';
                ctx.lineWidth = isMajor ? 4 : 2;
                ctx.lineCap = 'round';
                ctx.stroke();
            }
        }

        function drawNumbers(ctx, radius) {
            ctx.font = "bold 30px 'Kosugi Maru', sans-serif";
            ctx.textBaseline = "middle";
            ctx.textAlign = "center";
            ctx.fillStyle = "#111";
            for (let num = 1; num <= 12; num++) {
                let ang = num * Math.PI / 6;
                let numDist = radius * 0.68;
                let x = numDist * Math.sin(ang);
                let y = -numDist * Math.cos(ang);
                ctx.fillText(num.toString(), x, y);
            }
        }

        function drawHands(ctx, radius, totalMinutes) {
            let hours = Math.floor(totalMinutes / 60) % 12;
            let minutes = totalMinutes % 60;
            let hourAngle = (hours * Math.PI / 6) + (minutes * Math.PI / (6 * 60));
            let minuteAngle = (minutes * Math.PI / 30);
            
            drawHand(ctx, hourAngle, radius * 0.55, 16, '#5BC0EB');
            drawHand(ctx, minuteAngle, radius * 0.82, 10, '#E53935');
        }

        function drawHand(ctx, pos, length, width, color) {
            ctx.beginPath();
            ctx.lineWidth = width;
            ctx.lineCap = "round";
            let backOffset = length * 0.2;
            ctx.moveTo(-backOffset * Math.sin(pos), backOffset * Math.cos(pos));
            ctx.lineTo(length * Math.sin(pos), -length * Math.cos(pos));
            ctx.strokeStyle = color;
            ctx.stroke();
        }

        function drawCenterDot(ctx) {
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, 2 * Math.PI);
            ctx.fillStyle = 'white'; 
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#E53935';
            ctx.stroke();
        }

        function drawDigitalDisplay(ctx) {
            if (!isDigitalVisible) return;
            
            let safeMinutes = Math.floor(totalMinutes);
            safeMinutes = (safeMinutes % 1440 + 1440) % 1440; 
            let hours = Math.floor(safeMinutes / 60) % 24;
            let minutes = safeMinutes % 60;
            
            let timeStr = "";
            if (is12HourMode) {
                let displayHours = hours % 12 || 12;

                // ★ここだけ修正：コードではなく、実際の時刻を表示
                timeStr = `${displayHours}:${minutes.toString().padStart(2, '0')}`;
            } else {
                // ★ここだけ修正：コードではなく、実際の時刻を表示
                timeStr = `${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2, '0')}`;
            }
            
            ctx.save();
            let boxWidth = 120; 
            let boxHeight = 50;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)'; 
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.lineWidth = 2;
            
            ctx.beginPath();
            if(ctx.roundRect) {
                ctx.roundRect(-boxWidth/2, -boxHeight/2, boxWidth, boxHeight, 10);
            } else {
                ctx.rect(-boxWidth/2, -boxHeight/2, boxWidth, boxHeight);
            }
            ctx.fill();
            ctx.stroke();
            
            ctx.font = "bold 32px 'Kosugi Maru', sans-serif";
            ctx.textBaseline = "middle";
            ctx.textAlign = "center";
            ctx.fillStyle = 'rgba(20, 20, 20, 0.9)'; 
            ctx.fillText(timeStr, 0, 2); 
            ctx.restore();
        }

        function getValidMinutesForLevel(level) {
            let valid = [];
            if (level === 1) {
                valid = [0, 30];
            } else if (level === 2) {
                for (let i = 0; i < 60; i += 5) valid.push(i);
            } else {
                for (let i = 0; i < 60; i++) valid.push(i);
            }
            return valid;
        }

        function updateMinuteSelectDropdown(level) {
            minSelect.innerHTML = '';
            const validMinutes = getValidMinutesForLevel(level);
            validMinutes.forEach(m => {
                let optionText = m === 30 ? "30 (はん)" : m.toString();
                minSelect.add(new Option(optionText, m));
            });
        }

        function setQuizUIState() {
            const controlsToDisable = ['btn-now', 'btn-reset', 'btn-digital'];
            controlsToDisable.forEach(id => {
                document.getElementById(id).disabled = quiz.active;
            });

            if (quiz.active) {
                isDigitalVisible = false;
                document.getElementById('btn-digital').classList.remove('active-toggle');
                drawClock();
            }

            const disableTimeMods = quiz.active && quiz.currentType === 'read';
            document.querySelectorAll('.btn-time').forEach(btn => {
                btn.disabled = disableTimeMods;
            });

            const quizPanel = document.getElementById('quiz-panel');
            if (quiz.active) {
                quizPanel.classList.remove('hidden');
                document.getElementById('btn-quiz-open').classList.add('hidden');
            } else {
                quizPanel.classList.add('hidden');
                document.getElementById('btn-quiz-open').classList.remove('hidden');
            }

            if (quiz.currentType === 'set') {
                document.getElementById('quiz-input-area').classList.add('hidden');
            } else {
                document.getElementById('quiz-input-area').classList.remove('hidden');
            }
        }

        function generateQuiz() {
            quiz.isAnswered = false;
            
            if (quiz.mode === 'mix') {
                quiz.currentType = Math.random() > 0.5 ? 'set' : 'read';
            } else {
                quiz.currentType = quiz.mode;
            }

            const level = parseInt(levelSelect.value);
            const validMinutes = getValidMinutesForLevel(level);
            updateMinuteSelectDropdown(level);

            quiz.targetHour = Math.floor(Math.random() * 12) + 1;
            quiz.targetMinute = validMinutes[Math.floor(Math.random() * validMinutes.length)];

            const qText = document.getElementById('quiz-question');
            
            if (quiz.currentType === 'set') {
                let minTextHtml = quiz.targetMinute === 30 
                    ? `<span class="text-2xl md:text-3xl text-red-600">はん</span>` 
                    : `<span class="text-2xl md:text-3xl text-red-600">${quiz.targetMinute}</span> ふん`;
                
                qText.innerHTML = `<span class="text-2xl md:text-3xl text-blue-600">${quiz.targetHour}</span> じ ${minTextHtml} にあわせてね`;
                
                let randHour = Math.floor(Math.random() * 12) + 1;
                while (randHour === quiz.targetHour) randHour = Math.floor(Math.random() * 12) + 1;
                totalMinutes = randHour * 60; 
            } else {
                qText.innerHTML = `いま なんじ なんぷん？`;
                totalMinutes = quiz.targetHour * 60 + quiz.targetMinute;
                
                hourSelect.value = "1";
                if(minSelect.options.length > 0) {
                    minSelect.value = minSelect.options[0].value;
                }
            }

            document.getElementById('btn-quiz-check').classList.remove('hidden');
            document.getElementById('btn-quiz-next').classList.add('hidden');
            document.getElementById('quiz-feedback').classList.add('hidden');

            setQuizUIState();
            drawClock();
        }

        function checkQuiz() {
            if (quiz.isAnswered) return;
            quiz.isAnswered = true;

            let isCorrect = false;
            
            if (quiz.currentType === 'set') {
                let userHour = Math.floor(totalMinutes / 60) % 12 || 12;
                let userMin = Math.round(totalMinutes) % 60;
                isCorrect = (userHour === quiz.targetHour) && (userMin === quiz.targetMinute);
            } else {
                let uHour = parseInt(hourSelect.value);
                let uMin = parseInt(minSelect.value);
                isCorrect = (uHour === quiz.targetHour) && (uMin === quiz.targetMinute);
            }

            const feedback = document.getElementById('quiz-feedback');
            feedback.classList.remove('hidden');
            
            if (isCorrect) {
                feedback.innerHTML = `<span class="text-red-500">◎ せいかい！</span>`;
            } else {
                let answerMinText = quiz.targetMinute === 30 ? "はん" : `${quiz.targetMinute}ふん`;
                feedback.innerHTML = `<span class="text-blue-600">× ざんねん…</span><br><span class="text-lg font-normal text-gray-700">こたえは ${quiz.targetHour}じ ${answerMinText}</span>`;
            }

            document.getElementById('btn-quiz-check').classList.add('hidden');
            document.getElementById('btn-quiz-next').classList.remove('hidden');
            
            document.querySelectorAll('.btn-time').forEach(btn => btn.disabled = false);
        }

        document.getElementById('btn-quiz-open').addEventListener('click', () => {
            quiz.active = true;
            generateQuiz();
        });
        
        document.getElementById('btn-quiz-close').addEventListener('click', () => {
            quiz.active = false;
            setQuizUIState();
        });

        document.querySelectorAll('.btn-quiz-tab').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.btn-quiz-tab').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                quiz.mode = e.target.getAttribute('data-mode');
                generateQuiz();
            });
        });

        levelSelect.addEventListener('change', () => {
            if (quiz.active) {
                generateQuiz();
            }
        });

        document.getElementById('btn-quiz-check').addEventListener('click', checkQuiz);
        document.getElementById('btn-quiz-next').addEventListener('click', generateQuiz);

        function adjustTime(minutesToAdd) {
            totalMinutes += minutesToAdd;
            if (totalMinutes < 0) totalMinutes = 1440 + (totalMinutes % 1440);
            if (totalMinutes >= 1440) totalMinutes = totalMinutes % 1440;
            drawClock();
        }

        document.querySelectorAll('.btn-time').forEach(button => {
            button.addEventListener('click', (e) => {
                if(e.target.disabled) return;
                adjustTime(parseInt(e.target.getAttribute('data-offset')));
            });
        });

        document.getElementById('btn-digital').addEventListener('click', (e) => {
            if(quiz.active) return;
            isDigitalVisible = !isDigitalVisible;
            e.target.classList.toggle('active-toggle', isDigitalVisible);
            drawClock();
        });

        document.getElementById('btn-hint').addEventListener('click', (e) => {
            isHintVisible = !isHintVisible;
            e.target.classList.toggle('active-toggle', isHintVisible);
            drawClock();
        });

        document.getElementById('btn-reset').addEventListener('click', (e) => {
            if(e.target.disabled) return;
            totalMinutes = 720; 
            drawClock();
        });

        document.getElementById('btn-now').addEventListener('click', (e) => {
            if(e.target.disabled) return;
            const now = new Date();
            totalMinutes = (now.getHours() * 60) + now.getMinutes();
            drawClock();
        });

        document.getElementById('btn-1224').addEventListener('click', (e) => {
            is12HourMode = !is12HourMode;
            e.target.classList.toggle('active-toggle', is12HourMode);
            e.target.textContent = is12HourMode ? '12じかん' : '24じかん';
            drawClock();
        });
        
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * scaleX - cx,
                y: (clientY - rect.top) * scaleY - cy
            };
        }

        function getAngle(x, y) {
            let angle = Math.atan2(y, x) + Math.PI / 2;
            if (angle < 0) angle += 2 * Math.PI;
            return angle;
        }

        function handlePointerDown(e) {
            if (quiz.active && quiz.currentType === 'read' && !quiz.isAnswered) return;

            const pos = getMousePos(e);
            const distance = Math.sqrt(pos.x * pos.x + pos.y * pos.y);
            const angle = getAngle(pos.x, pos.y);

            let hours = Math.floor(totalMinutes / 60) % 12;
            let minutes = totalMinutes % 60;
            let hourAngle = ((hours * Math.PI / 6) + (minutes * Math.PI / (6 * 60))) % (2 * Math.PI);
            let minuteAngle = (minutes * Math.PI / 30) % (2 * Math.PI);

            const getAngDist = (a, b) => {
                let d = Math.abs(a - b) % (2 * Math.PI);
                return d > Math.PI ? 2 * Math.PI - d : d;
            };

            const tol = 0.4; 
            if (distance < clockRadius * 0.9 && getAngDist(angle, minuteAngle) < tol) {
                isDragging = true; draggedHand = 'minute'; lastAngle = angle;
                canvas.style.cursor = 'grabbing';
                if (e.cancelable) e.preventDefault(); 
            } else if (distance < clockRadius * 0.7 && getAngDist(angle, hourAngle) < tol) {
                isDragging = true; draggedHand = 'hour'; lastAngle = angle;
                canvas.style.cursor = 'grabbing';
                if (e.cancelable) e.preventDefault();
            }
        }

        function handlePointerMove(e) {
            if (!isDragging) {
                if (quiz.active && quiz.currentType === 'read' && !quiz.isAnswered) return;
                const pos = getMousePos(e);
                const angle = getAngle(pos.x, pos.y);
                const distance = Math.sqrt(pos.x * pos.x + pos.y * pos.y);
                let hours = Math.floor(totalMinutes / 60) % 12;
                let minutes = totalMinutes % 60;
                let hourAngle = ((hours * Math.PI / 6) + (minutes * Math.PI / (6 * 60))) % (2 * Math.PI);
                let minuteAngle = (minutes * Math.PI / 30) % (2 * Math.PI);
                const getAngDist = (a, b) => { 
                    let d = Math.abs(a - b) % (2 * Math.PI); 
                    return d > Math.PI ? 2 * Math.PI - d : d; 
                };
                
                if ((distance < clockRadius * 0.9 && getAngDist(angle, minuteAngle) < 0.4) || 
                    (distance < clockRadius * 0.7 && getAngDist(angle, hourAngle) < 0.4)) {
                    canvas.style.cursor = 'grab';
                } else {
                    canvas.style.cursor = 'default';
                }
                return;
            }
            
            if (e.cancelable) e.preventDefault(); 
            
            const pos = getMousePos(e);
            const angle = getAngle(pos.x, pos.y);
            let deltaAngle = angle - lastAngle;
            if (deltaAngle > Math.PI) deltaAngle -= 2 * Math.PI;
            if (deltaAngle < -Math.PI) deltaAngle += 2 * Math.PI;

            if (draggedHand === 'minute') {
                totalMinutes += (deltaAngle / (2 * Math.PI)) * 60;
            } else if (draggedHand === 'hour') {
                totalMinutes += (deltaAngle / (2 * Math.PI)) * 720;
            }

            if (totalMinutes < 0) totalMinutes = 1440 + (totalMinutes % 1440);
            if (totalMinutes >= 1440) totalMinutes = totalMinutes % 1440;

            lastAngle = angle;
            drawClock();
        }

        function handlePointerUp() {
            if (isDragging) {
                isDragging = false; 
                draggedHand = null;
                canvas.style.cursor = 'default';
                totalMinutes = Math.round(totalMinutes);
                drawClock();
            }
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);
        canvas.addEventListener('touchstart', handlePointerDown, {passive: false});
        window.addEventListener('touchmove', handlePointerMove, {passive: false});
        window.addEventListener('touchend', handlePointerUp);

        document.fonts.ready.then(() => {
            drawClock();
        });
    </script>
</body>
</html>
